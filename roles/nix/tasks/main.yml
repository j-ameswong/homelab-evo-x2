# Multi-user Nix: a nix-daemon service, root-owned /nix and build users. Flakes only,
# so no channels.
- name: Install the Nix installer's prerequisites
  ansible.builtin.apt:
    name: [curl, xz-utils]
    lock_timeout: 600

- name: Download the Nix installer
  ansible.builtin.get_url:
    url: "https://releases.nixos.org/nix/nix-{{ nix_version }}/install"
    dest: "/root/nix-install-{{ nix_version }}.sh"
    mode: "0700"

- name: Install Nix
  ansible.builtin.command: sh /root/nix-install-{{ nix_version }}.sh --daemon --yes --no-channel-add
  args:
    creates: /nix/var/nix/profiles/default/bin/nix

# devenv's binary cache is trusted here because untrusted users can't add caches themselves.
- name: Configure Nix
  ansible.builtin.blockinfile:
    path: /etc/nix/nix.conf
    marker: "# {mark} managed by Ansible"
    block: |
      experimental-features = nix-command flakes
      extra-substituters = https://devenv.cachix.org
      extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=
  register: nix_conf

- name: Start nix-daemon
  ansible.builtin.systemd_service:
    name: nix-daemon
    enabled: true
    state: "{{ 'restarted' if nix_conf is changed else 'started' }}"
